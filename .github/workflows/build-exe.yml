name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build JAR
        run: mvn -B clean package -DskipTests

      - name: Download JavaFX jmods
        shell: pwsh
        run: |
          $url = "https://download2.gluonhq.com/openjfx/21.0.2/openjfx-21.0.2_windows-x64_bin-jmods.zip"
          Invoke-WebRequest -Uri $url -OutFile javafx-jmods.zip
          Expand-Archive javafx-jmods.zip -DestinationPath .

      - name: Create EXE
        shell: pwsh
        run: |
          $jmods = (Get-ChildItem -Directory -Filter "javafx-jmods-*").FullName
          $version = "2.0.0"
          
          New-Item -ItemType Directory -Force -Path pkg-input
          Copy-Item "target\LedgerX-$version.jar" -Destination "pkg-input\LedgerX.jar"

          jpackage `
            --type exe `
            --name LedgerX `
            --app-version $version `
            --input pkg-input `
            --main-jar LedgerX.jar `
            --main-class io.github.vexisvx.ledgerx.Launcher `
            --module-path "$jmods" `
            --add-modules javafx.controls,javafx.fxml,javafx.graphics,javafx.base `
            --win-shortcut `
            --win-menu `
            --win-dir-chooser `
            --java-options "-Dfile.encoding=UTF-8" `
            --dest target\installer

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: LedgerX-Windows-EXE
          path: target/installer/*.exe
          retention-days: 30
